services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: codetogether
      POSTGRES_PASSWORD: codetogether
      POSTGRES_DB: codetogether
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U codetogether -d codetogether']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
